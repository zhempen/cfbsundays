# Signup handler for the Tuesday email. Deployed by .github/workflows/worker.yml,
# which fills in the D1 database id and sets the secrets (RESEND_API_KEY,
# TURNSTILE_SECRET) from the repo's GitHub secrets.
name = "cfbsundays-signup"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
account_id = "ff4796ba0079d854581dba41b741217c"

# keep error logs so failures can be read in the Cloudflare dashboard
[observability]
enabled = true

# Site rebuilds (UTC). Every morning, then on the half hour through Sunday
# (and late-season Saturday) games and after Monday and Thursday night games.
# In Eastern standard time: 6:15 AM daily; 4:30 PM to 1:30 AM Sat/Sun;
# 11:30 PM to 1:30 AM Mon/Thu nights. An hour later on the clock during daylight time.
[triggers]
crons = ["15 11 * * *", "30 21-23 * * 0,6", "30 0-6 * * 0,1", "30 4-6 * * 2,5"]

[vars]
SITE = "https://cfbsundays.com"
ORIGINS = "https://cfbsundays.com,https://www.cfbsundays.com"
FROM = "CFB Sundays <tuesday@mail.cfbsundays.com>"
REPLY_TO = "hello@cfbsundays.com"

[[d1_databases]]
binding = "DB"
database_name = "cfbsundays"
database_id = "__D1_ID__"
