name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # UTC. Daily morning refresh, plus evening refreshes on game days
    # (Sun/Mon/Thu nights ET land on 00:00-09:00 UTC Mon/Tue/Fri).
    - cron: "17 10 * * *"
    - cron: "17 2 * * 1,2,5"
    # GitHub often starts these hours late, so they are only a backup. The on-time
    # game-day builds come from the Cloudflare Worker (worker/src/index.js, BUILD_TIMES).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build data files
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # deploy-pages sometimes finds no artifact right after the upload finishes
      # ("Found 0 artifact(s)", Nov 2026). If the first try fails, wait and try once more.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
