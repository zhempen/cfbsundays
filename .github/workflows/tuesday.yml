name: Tuesday email

# Runs at 11:07 and 12:07 UTC on Tuesdays; the script sends in the first run
# that starts at or after 7 AM New York time (so daylight saving needs no
# edits, and a late start still sends), and never sends the same week twice.
# Run it by hand from the Actions tab to send a missed week; tick "force" only
# if it's before 7 AM New York time. Push to the "email-sample" branch to send
# the latest week to the (3 or fewer) test subscribers without recording it.
on:
  schedule:
    - cron: "7 11 * * 2"
    - cron: "7 12 * * 2"
  push:
    branches: [email-sample]
  workflow_dispatch:
    inputs:
      force:
        description: "Send now even if it's before 7 AM New York time (a week already sent still won't resend)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tuesday-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MODE: ${{ github.event_name == 'push' && 'sample' || 'send' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 scripts/send_tuesday.py
