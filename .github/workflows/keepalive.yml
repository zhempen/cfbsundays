name: Keep schedules alive

# GitHub turns off scheduled workflows in a public repo after 60 days with no commits.
# This makes one small commit a month (.github/keepalive) so the daily data refresh
# and the Tuesday email keep running during quiet stretches.
# Commits made with GITHUB_TOKEN do not trigger other workflows, so this never redeploys the site.

on:
  schedule:
    - cron: "41 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep scheduled workflows active"
          git push
